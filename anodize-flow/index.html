let currentTab = 'dashboard';

function initNav() {
  const desk = document.getElementById('nav-desktop');
  const mob = document.getElementById('nav-mobile');
  desk.innerHTML = mob.innerHTML = '';
  NAV_ITEMS.forEach(item => {
    desk.innerHTML += `<button onclick="switchTab('${item.id}')" class="w-full flex items-center gap-3 px-4 py-3 rounded text-sm font-medium transition ${currentTab===item.id?'bg-brand text-cyan-400 font-bold':'text-slate-300 hover:bg-slate-800'}"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">${item.icon}</svg>${item.label}</button>`;

  });
  document.getElementById('role-badge').innerText = DB.role;
  document.getElementById('user-role-display').innerText = 'Ruolo: ' + DB.role;
}

function switchTab(tabId) {
  currentTab = tabId;
  initNav();
  const title = tabId === 'settings' ? 'Impostazioni' : NAV_ITEMS.find(n => n.id === tabId)?.label || 'AnodizeFlow';
  document.getElementById('page-title').innerText = title;
  const main = document.getElementById('main-content');

  if (tabId === 'dashboard') renderDashboard(main);
  else if (tabId === 'configurator') renderConfigurator(main);
  else if (tabId === 'quotes') renderQuotes(main);
  else if (tabId === 'planning') renderPlanning(main);
  else if (tabId === 'settings') renderSettings(main);
}

function toast(msg) {

function drawTechnicalCAD() {
  const canvas = document.getElementById('cadCanvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const wVal = parseInt(document.getElementById('inf-w').value) || 1200;
  const hVal = parseInt(document.getElementById('inf-h').value) || 1400;
  const tipo = document.getElementById('inf-tipo').value;
  const colorName = document.getElementById('inf-colore').value;

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  // Background grid
  ctx.strokeStyle = '#1E293B';
  ctx.lineWidth = 1;
  for(let x=0; x<canvas.width; x+=20) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke(); }
  for(let y=0; y<canvas.height; y+=20) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke(); }

  // Frame colors based on finish
  let frameColor = '#94A3B8';
  if(colorName.includes('Nero')) frameColor = '#334155';
  if(colorName.includes('Bronzo')) frameColor = '#78350F';
  if(colorName.includes('Oro')) frameColor = '#CA8A04';

  const margin = 40;
  const maxW = canvas.width - (margin * 2);
  const maxH = canvas.height - (margin * 2);
  const scale = Math.min(maxW / wVal, maxH / hVal);

  const drawW = wVal * scale;
  const drawH = hVal * scale;
  const startX = (canvas.width - drawW) / 2;
  const startY = (canvas.height - drawH) / 2;

  // Outer Frame
  ctx.strokeStyle = frameColor;
  ctx.lineWidth = 8;
  ctx.strokeRect(startX, startY, drawW, drawH);

  // Glass background
  ctx.fillStyle = 'rgba(56, 189, 248, 0.2)';
  ctx.fillRect(startX+4, startY+4, drawW-8, drawH-8);

  // Inner sash/profiles based on type
  ctx.lineWidth = 4;
  if(tipo === 'Finestra 2 Ante' || tipo === 'Scorrevole Traslante') {
    ctx.beginPath();
    ctx.moveTo(startX + drawW/2, startY);
    ctx.lineTo(startX + drawW/2, startY + drawH);
    ctx.stroke();
  }

  // Quote / Dimensions text
  ctx.fillStyle = '#38BDF8';
  ctx.font = '10px monospace';
  ctx.fillText(`${wVal} mm`, startX + drawW/2 - 20, startY - 8);
  ctx.save();
  ctx.translate(startX - 8, startY + drawH/2 + 20);
  ctx.rotate(-Math.PI/2);
  ctx.fillText(`${hVal} mm`, 0, 0);
  ctx.restore();
}

function handleInfissoSubmit(e) {
  e.preventDefault();
  const w = parseInt(document.getElementById('inf-w').value);
  const h = parseInt(document.getElementById('inf-h').value);
  const estimatedPrice = Math.round((w * h / 1000000) * 350 + 200);

  const newInf = {
    id: Date.now(),
    progetto_id: parseInt(document.getElementById('inf-progetto').value),
    tipologia: document.getElementById('inf-tipo').value,
    larghezza: w,
    altezza: h,
    colore_anodizzazione: document.getElementById('inf-colore').value,
    tipo_vetro: document.getElementById('inf-vetro').value,
    prezzo_unitario: estimatedPrice
  };

  DB.infissis.push(newInf);
  saveDB();
  toast('Infisso aggiunto con successo');
  renderConfigurator(document.getElementById('main-content'));
}

function changeRole(r) { DB.role = r; saveDB(); initNav(); toast('Ruolo aggiornato in: ' + r); }
function resetData() { localStorage.removeItem('anodize-flow_dati'); DB = JSON.parse(JSON.stringify(INITIAL_DATA)); saveDB(); switchTab(currentTab); toast('Dati ripristinati'); }
function clearData() { DB = { role: DB.role, clientes:[], progettis:[], infissis:[], preventivis:[], ordinicantieres:[] }; saveDB(); switchTab(currentTab); toast('Tutti i dati cancellati'); }

function exportCSV() {
  let csv = "Entita,ID,Info\n";
  DB.clientes.forEach(c => csv += `Cliente,${c.id},"${c.ragione_sociale}"\n`);
  DB.progettis.forEach(p => csv += `Progetto,${p.id},"${p.stato}"\n`);
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'anodizeflow_export.csv';
  a.click();
  toast('Export CSV completato');
}

function deleteEntity(table, id) {
  if(confirm('Confermi l\'eliminazione?')) {
    DB[table] = DB[table].filter(x => x.id !== id);
    saveDB();
    switchTab(currentTab);
    toast('Elemento eliminato');
  }
}

function openModal(title, contentHTML) {
  document.getElementById('modal-title').innerText = title;
  document.getElementById('modal-body').innerHTML = contentHTML;
  document.getElementById('modal-container').classList.remove('hidden');
  document.getElementById('modal-container').classList.add('flex');
}
function closeModal() {
  document.getElementById('modal-container').classList.add('hidden');
  document.getElementById('modal-container').classList.remove('flex');
}

function getProjectFormHTML() {

function saveProject(e) {
  e.preventDefault();
  const cliId = Date.now();
  const prjId = Math.floor(Math.random()*899)+100;
  DB.clientes.push({
    id: cliId,
    ragione_sociale: document.getElementById('m-cli-name').value,
    partita_iva: document.getElementById('m-cli-piva').value,
    indirizzo: document.getElementById('m-cli-dir').value,
    telefono: document.getElementById('m-cli-tel').value,
    email: ''
  });
  DB.progettis.push({
    id: prjId,
    cliente_id: cliId,
    data_creazione: new Date().toISOString().split('T')[0],
    stato: 'In lavorazione',
    note_tecniche: document.getElementById('m-prj-notes').value
  });
  saveDB();
  closeModal();
  toast('Progetto creato');
  switchTab('dashboard');
}

function saveQuote(e) {
  e.preventDefault();
  const imp = parseFloat(document.getElementById('mq-imp').value);
  const posa = parseFloat(document.getElementById('mq-posa').value);
  DB.preventivis.push({
    id: Date.now(),
    progetto_id: parseInt(document.getElementById('mq-prj').value),
    totale_imponibile: imp,
    costo_posa: posa,
    iva: Math.round((imp + posa) * 0.22),
    data_scadenza: document.getElementById('mq-date').value,
    approvato: false
  });
  saveDB();
  closeModal();
  toast('Preventivo generato');
  switchTab('quotes');
}

function approveQuote(id) {
  const q = DB.preventivis.find(x => x.id === id);
  if(q) { q.approvato = true; saveDB(); switchTab('quotes'); toast('Preventivo approvato'); }
}
