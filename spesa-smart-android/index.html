<!DOCTYPE html>
<html lang="it" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SpesaSmart</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1B5E20">
    <link rel="icon" href="icon.svg">
    <link rel="apple-touch-icon" href="icon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#E8F5E9', 100: '#C8E6C9', 600: '#1B5E20', 700: '#144E19', 800: '#0F3C12' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="h-full bg-gray-100 flex justify-center items-center overflow-hidden">
    <div id="app" class="w-full h-full sm:max-w-md sm:h-[90vh] sm:rounded-3xl sm:shadow-2xl bg-white flex flex-col relative overflow-hidden">
        <header class="bg-brand-600 text-white px-4 py-3 flex justify-between items-center z-10 shadow-md">
            <div class="flex items-center space-x-2">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <h1 id="app-title" class="font-bold text-lg tracking-wide">SpesaSmart</h1>
            </div>
            <button onclick="naviga('impostazioni')" class="p-1 rounded-full hover:bg-brand-700 transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            </button>
        </header>

        <main id="main-content" class="flex-1 overflow-y-auto p-4 pb-20 hide-scrollbar bg-gray-50"></main>

        <nav class="absolute bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around py-2 z-10 shadow-lg">
            <button onclick="naviga('dashboard')" id="nav-dashboard" class="flex flex-col items-center text-gray-500 hover:text-brand-600 transition flex-1 py-1"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg><span class="text-[10px] font-medium mt-1">Dashboard</span></button>
            <button onclick="naviga('risparmio')" id="nav-risparmio" class="flex flex-col items-center text-gray-500 hover:text-brand-600 transition flex-1 py-1"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg><span class="text-[10px] font-medium mt-1">Risparmio</span></button>
            <button onclick="naviga('promemoria')" id="nav-promemoria" class="flex flex-col items-center text-gray-500 hover:text-brand-600 transition flex-1 py-1"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg><span class="text-[10px] font-medium mt-1">Promemoria</span></button>
            <button onclick="naviga('analisi')" id="nav-analisi" class="flex flex-col items-center text-gray-500 hover:text-brand-600 transition flex-1 py-1"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg><span class="text-[10px] font-medium mt-1">Analisi</span></button>
        </nav>
    </div>

    <script>
        const KEY = 'spesa-smart-android_dati';
        const datiDefault = {
            spese: [
                { id: 1, importo: 15.50, categoria: 'Alimentari', data: new Date().toISOString().split('T')[0], nota: 'Spesa supermercato' },
                { id: 2, importo: 4.20, categoria: 'Svago', data: new Date().toISOString().split('T')[0], nota: 'Caffè e cornetto' },
                { id: 3, importo: 45.00, categoria: 'Casa', data: new Date(Date.now()-86400000).toISOString().split('T')[0], nota: 'Bolletta luce' }
            ],
            obiettivi: [
                { id: 1, titolo: 'Vacanza estiva', importo_target: 800, importo_attuale: 350, data_scadenza: '2025-08-01' },
                { id: 2, titolo: 'Nuovo Smartphone', importo_target: 600, importo_attuale: 420, data_scadenza: '2025-11-15' }
            ],
            promemoria: [
                { id: 1, titolo: 'Affitto', data_ora: new Date(Date.now()+86400000*3).toISOString().slice(0,16), frequenza: 'Mensile', completato: false },
                { id: 2, titolo: 'Abbonamento Palestra', data_ora: new Date(Date.now()+86400000*5).toISOString().slice(0,16), frequenza: 'Annuale', completato: true }
            ]
        };

        let db = JSON.parse(localStorage.getItem(KEY)) || datiDefault;
        let paginaCorrente = 'dashboard';

        function salvaDb() {
            localStorage.setItem(KEY, JSON.stringify(db));
        }

        function naviga(pagina) {
            paginaCorrente = pagina;
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('text-brand-600', 'font-bold'));
            const btn = document.getElementById(`nav-${pagina}`);
            if(btn) btn.classList.add('text-brand-600', 'font-bold');
            renderizza();
        }

        function renderizza() {
            const main = document.getElementById('main-content');
            main.innerHTML = '';
            if(paginaCorrente === 'dashboard') renderDashboard(main);
            else if(paginaCorrente === 'risparmio') renderRisparmio(main);
            else if(paginaCorrente === 'promemoria') renderPromemoria(main);
            else if(paginaCorrente === 'analisi') renderAnalisi(main);
            else if(paginaCorrente === 'impostazioni') renderImpostazioni(main);
        }

        function renderDashboard(el) {
            const oggi = new Date().toISOString().split('T')[0];
            const spesaOggi = db.spese.filter(s => s.data === oggi).reduce((acc, s) => acc + s.importo, 0);
            const spesaTotaleMese = db.spese.reduce((acc, s) => acc + s.importo, 0);

            el.innerHTML = `
                <div class="space-y-4">
                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-brand-50 p-3 rounded-2xl border border-brand-100 shadow-sm">
                            <span class="text-xs text-brand-700 font-medium">Spese Oggi</span>
                            <h2 class="text-xl font-bold text-brand-800">€ ${spesaOggi.toFixed(2)}</h2>
                        </div>
                        <div class="bg-white p-3 rounded-2xl border border-gray-200 shadow-sm">
                            <span class="text-xs text-gray-500 font-medium">Totale Registrato</span>
                            <h2 class="text-xl font-bold text-gray-800">€ ${spesaTotaleMese.toFixed(2)}</h2>
                        </div>
                    </div>

                    <div class="bg-white p-4 rounded-2xl border border-gray-200 shadow-sm">
                        <h3 class="font-bold text-gray-800 text-sm mb-3">Aggiungi Nuova Spesa</h3>
                        <form onsubmit="aggiungiSpesa(event)" class="space-y-3">
                            <div class="grid grid-cols-2 gap-2">
                                <input type="number" step="0.01" id="imp-spesa" placeholder="Importo €" required class="w-full p-2.5 text-sm bg-gray-50 border border-gray-300 rounded-xl focus:outline-none focus:border-brand-600">
                                <select id="cat-spesa" class="w-full p-2.5 text-sm bg-gray-50 border border-gray-300 rounded-xl focus:outline-none focus:border-brand-600">
                                    <option value="Alimentari">Alimentari</option>
                                    <option value="Casa">Casa</option>
                                    <option value="Svago">Svago</option>
                                    <option value="Trasporti">Trasporti</option>
                                    <option value="Altro">Altro</option>
                                </select>
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <input type="date" id="data-spesa" value="${oggi}" required class="w-full p-2.5 text-sm bg-gray-50 border border-gray-300 rounded-xl focus:outline-none focus:border-brand-600">
                                <input type="text" id="nota-spesa" placeholder="Nota (opzionale)" class="w-full p-2.5 text-sm bg-gray-50 border border-gray-300 rounded-xl focus:outline-none focus:border-brand-600">
                            </div>
                            <button type="submit" class="w-full bg-brand-600 text-white font-semibold py-2.5 rounded-xl text-sm shadow hover:bg-brand-700 transition">Registra Spesa</button>
                        </form>
                    </div>

                    <div>
                        <h3 class="font-bold text-gray-800 text-sm mb-2">Ultime Uscite</h3>
                        <div class="space-y-2">
                            ${db.spese.length === 0 ? '<p class="text-xs text-gray-400 text-center py-4">Nessuna spesa registrata</p>' : 
                              db.spese.slice().reverse().map(s => `
                                <div class="bg-white p-3 rounded-2xl border border-gray-200 flex justify-between items-center shadow-sm">
                                    <div>
                                        <div class="flex items-center space-x-2">
                                            <span class="text-xs font-bold px-2 py-0.5 bg-brand-50 text-brand-700 rounded-full">${s.categoria}</span>
                                            <span class="text-xs text-gray-400">${s.data}</span>
                                        </div>
                                        <p class="text-sm font-medium text-gray-800 mt-1">${s.nota || 'Senza nota'}</p>
                                    </div>
                                    <div class="flex items-center space-x-3">
                                        <span class="font-bold text-red-600 text-sm">-€ ${s.importo.toFixed(2)}</span>
                                        <button onclick="eliminaSpesa(${s.id})" class="text-gray-400 hover:text-red-500"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function aggiungiSpesa(e) {
            e.preventDefault();
            const nuovo = {
                id: Date.now(),
                importo: parseFloat(document.getElementById('imp-spesa').value),
                categoria: document.getElementById('cat-spesa').value,
                data: document.getElementById('data-spesa').value,
                nota: document.getElementById('nota-spesa').value
            };
            db.spese.push(nuovo);
            salvaDb();
            renderizza();
        }

        function eliminaSpesa(id) {
            if(confirm("Vuoi eliminare questa spesa?")) {
                db.spese = db.spese.filter(s => s.id !== id);
                salvaDb();
                renderizza();
            }
        }

        function renderRisparmio(el) {
            el.innerHTML = `
                <div class="space-y-4">
                    <div class="bg-gradient-to-r from-brand-600 to-brand-800 text-white p-4 rounded-2xl shadow">
                        <h3 class="font-bold text-sm">Simulatore Taglio Spese</h3>
                        <p class="text-xs text-brand-100 mt-1">Elimina una spesa superflua giornaliera e guarda quanto risparmi in un anno.</p>
                        <div class="mt-3 flex items-center space-x-2">
                            <input type="number" id="taglio-giornaliero" value="3.50" oninput="calcolaTaglio()" class="w-24 p-2 text-gray-800 font-bold text-sm rounded-xl bg-white focus:outline-none">
                            <span class="text-xs text-brand-100">€ al giorno</span>
                        </div>
                        <div class="mt-3 pt-3 border-t border-brand-700 flex justify-between items-center">
                            <span class="text-xs">Risparmio annuo stimato:</span>
                            <span id="risultato-taglio" class="text-lg font-bold text-yellow-300">€ 1.277,50</span>
                        </div>
                    </div>

                    <div class="bg-white p-4 rounded-2xl border border-gray-200 shadow-sm">
                        <h3 class="font-bold text-gray-800 text-sm mb-3">Nuovo Obiettivo</h3>
                        <form onsubmit="aggiungiObiettivo(event)" class="space-y-3">
                            <input type="text" id="obj-titolo" placeholder="Nome obiettivo (es. Auto nuova)" required class="w-full p-2.5 text-sm bg-gray-50 border border-gray-300 rounded-xl focus:outline-none focus:border-brand-600">
                            <div class="grid grid-cols-2 gap-2">
                                <input type="number" id="obj-target" placeholder="Target €" required class="w-full p-2.5 text-sm bg-gray-50 border border-gray-300 rounded-xl focus:outline-none focus:border-brand-600">
                                <input type="number" id="obj-attuale" placeholder="Già accantonato €" required class="w-full p-2.5 text-sm bg-gray-50 border border-gray-300 rounded-xl focus:outline-none focus:border-brand-600">
                            </div>
                            <input type="date" id="obj-scadenza" required class="w-full p-2.5 text-sm bg-gray-50 border border-gray-300 rounded-xl focus:outline-none focus:border-brand-600">
                            <button type="submit" class="w-full bg-brand-600 text-white font-semibold py-2.5 rounded-xl text-sm shadow hover:bg-brand-700 transition">Crea Obiettivo</button>
                        </form>
                    </div>

                    <div class="space-y-3">
                        <h3 class="font-bold text-gray-800 text-sm">I tuoi Obiettivi</h3>
                        ${db.obiettivi.length === 0 ? '<p class="text-xs text-gray-400 text-center py-4">Nessun obiettivo impostato</p>' :
                          db.obiettivi.map(o => {
                              const perc = Math.min(100, Math.round((o.importo_attuale / o.importo_target) * 100));
                              return `
                                <div class="bg-white p-4 rounded-2xl border border-gray-200 shadow-sm space-y-2">
                                    <div class="flex justify-between items-center">
                                        <h4 class="font-bold text-sm text-gray-800">${o.titolo}</h4>
                                        <button onclick="eliminaObiettivo(${o.id})" class="text-gray-400 hover:text-red-500"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button>
                                    </div>
                                    <div class="flex justify-between text-xs text-gray-500">
                                        <span>€ ${o.importo_attuale} di € ${o.importo_target}</span>
                                        <span class="font-bold text-brand-600">${perc}%</span>
                                    </div>
                                    <div class="w-full bg-gray-100 h-2 rounded-full overflow-hidden">
                                        <div class="bg-brand-600 h-full rounded-full" style="width: ${perc}%"></div>
                                    </div>
                                    <div class="flex justify-end"><button onclick="depositaObiettivo(${o.id})" class="text-xs bg-brand-50 text-brand-700 font-semibold px-3 py-1 rounded-lg hover:bg-brand-100">+ Aggiungi 50€</button></div>
                                </div>
                              `;
                          }).join('')}
                    </div>
                </div>
            `;
            calcolaTaglio();
        }

        function calcolaTaglio() {
            const val = parseFloat(document.getElementById('taglio-giornaliero').value) || 0;
            const annuo = val * 365;
            document.getElementById('risultato-taglio').innerText = `€ ${annuo.toFixed(2)}`;
        }

        function aggiungiObiettivo(e) {
            e.preventDefault();
            db.obiettivi.push({
                id: Date.now(),
                titolo: document.getElementById('obj-titolo').value,
                importo_target: parseFloat(document.getElementById('obj-target').value),
                importo_attuale: parseFloat(document.getElementById('obj-attuale').value),
                data_scadenza: document.getElementById('obj-scadenza').value
            });
            salvaDb();
            renderizza();
        }

        function eliminaObiettivo(id) {
            if(confirm("Eliminare questo obiettivo?")) {
                db.obiettivi = db.obiettivi.filter(o => o.id !== id);
                salvaDb();
                renderizza();
            }
        }

        function depositaObiettivo(id) {
            const obj = db.obiettivi.find(o => o.id === id);
            if(obj) {
                obj.importo_attuale += 50;
                salvaDb();
                renderizza();
            }
        }

        function renderPromemoria(el) {
            el.innerHTML = `
                <div class="space-y-4">
                    <div class="bg-white p-4 rounded-2xl border border-gray-200 shadow-sm">
                        <h3 class="font-bold text-gray-800 text-sm mb-3">Nuovo Promemoria</h3>
                        <form onsubmit="aggiungiPromemoria(event)" class="space-y-3">
                            <input type="text" id="rem-titolo" placeholder="Titolo (es. Bolletta Internet)" required class="w-full p-2.5 text-sm bg-gray-50 border border-gray-300 rounded-xl focus:outline-none focus:border-brand-600">
                            <div class="grid grid-cols-2 gap-2">
                                <input type="datetime-local" id="rem-data" required class="w-full p-2.5 text-sm bg-gray-50 border border-gray-300 rounded-xl focus:outline-none focus:border-brand-600">
                                <select id="rem-freq" class="w-full p-2.5 text-sm bg-gray-50 border border-gray-300 rounded-xl focus:outline-none focus:border-brand-600">
                                    <option value="Una tantum">Una tantum</option>
                                    <option value="Mensile">Mensile</option>
                                    <option value="Annuale">Annuale</option>
                                </select>
                            </div>
                            <button type="submit" class="w-full bg-brand-600 text-white font-semibold py-2.5 rounded-xl text-sm shadow hover:bg-brand-700 transition">Imposta Promemoria</button>
                        </form>
                    </div>

                    <div class="space-y-2">
                        <h3 class="font-bold text-gray-800 text-sm">Lista Promemoria</h3>
                        ${db.promemoria.length === 0 ? '<p class="text-xs text-gray-400 text-center py-4">Nessun promemoria attivo</p>' :
                          db.promemoria.map(r => `
                            <div class="bg-white p-3 rounded-2xl border border-gray-200 flex justify-between items-center shadow-sm">
                                <div class="flex items-center space-x-3">
                                    <input type="checkbox" ${r.completato ? 'checked' : ''} onchange="togglePromemoria(${r.id})" class="w-5 h-5 accent-brand-600 rounded">
                                    <div>
                                        <h4 class="text-sm font-semibold ${r.completato ? 'line-through text-gray-400' : 'text-gray-800'}">${r.titolo}</h4>
                                        <span class="text-[10px] text-gray-400">${r.data_ora.replace('T', ' ')} • ${r.frequenza}</span>
                                    </div>
                                </div>
                                <button onclick="eliminaPromemoria(${r.id})" class="text-gray-400 hover:text-red-500"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button>
                            </div>
                          `).join('')}
                    </div>
                </div>
            `;
        }

        function aggiungiPromemoria(e) {
            e.preventDefault();
            db.promemoria.push({
                id: Date.now(),
                titolo: document.getElementById('rem-titolo').value,
                data_ora: document.getElementById('rem-data').value,
                frequenza: document.getElementById('rem-freq').value,
                completato: false
            });
            salvaDb();
            renderizza();
        }

        function togglePromemoria(id) {
            const r = db.promemoria.find(x => x.id === id);
            if(r) {
                r.completato = !r.completato;
                salvaDb();
                renderizza();
            }
        }

        function eliminaPromemoria(id) {
            if(confirm("Eliminare questo promemoria?")) {
                db.promemoria = db.promemoria.filter(r => r.id !== id);
                salvaDb();
                renderizza();
            }
        }

        function renderAnalisi(el) {
            const categorie = ['Alimentari', 'Casa', 'Svago', 'Trasporti', 'Altro'];
            const totaliCat = categorie.map(cat => {
                return db.spese.filter(s => s.categoria === cat).reduce((acc, s) => acc + s.importo, 0);
            });
            const maxCat = Math.max(...totaliCat, 1);
            const totaleGen = totaliCat.reduce((a,b)=>a+b, 0);

            el.innerHTML = `
                <div class="space-y-4">
                    <div class="bg-white p-4 rounded-2xl border border-gray-200 shadow-sm">
                        <h3 class="font-bold text-gray-800 text-sm mb-3">Distribuzione per Categoria</h3>
                        <div class="space-y-3">
                            ${categorie.map((cat, i) => {
                                const val = totaliCat[i];
                                const perc = totaleGen > 0 ? Math.round((val / totaleGen) * 100) : 0;
                                const larghezza = Math.round((val / maxCat) * 100);
                                return `
                                    <div>
                                        <div class="flex justify-between text-xs font-medium text-gray-700 mb-1">
                                            <span>${cat}</span>
                                            <span>€ ${val.toFixed(2)} (${perc}%)</span>
                                        </div>
                                        <div class="w-full bg-gray-100 h-2.5 rounded-full overflow-hidden">
                                            <div class="bg-brand-600 h-full rounded-full" style="width: ${larghezza}%"></div>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>

                    <div class="bg-brand-50 p-4 rounded-2xl border border-brand-100 shadow-sm space-y-2">
                        <h3 class="font-bold text-brand-800 text-sm flex items-center">
                            <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                            Consigli Smart
                        </h3>
                        <p class="text-xs text-brand-700 leading-relaxed">
                            ${totaleGen > 100 ? "Hai superato i 100€ di spesa registrata. La categoria principale assorbe la maggior parte del budget: valuta piccoli tagli mirati." : "La gestione delle spese è al momento contenuta. Continua a registrare ogni singola uscita per avere analisi più dettagliate."}
                        </p>
                    </div>
                </div>
            `;
        }

        function renderImpostazioni(el) {
            el.innerHTML = `
                <div class="space-y-4">
                    <div class="bg-white p-4 rounded-2xl border border-gray-200 shadow-sm space-y-3">
                        <h3 class="font-bold text-gray-800 text-sm">Gestione Dati</h3>
                        <button onclick="ripristinaDati()" class="w-full bg-brand-50 text-brand-700 font-semibold py-2.5 rounded-xl text-xs hover:bg-brand-100 transition">Ripristina dati di esempio</button>
                        <button onclick="cancellaTutto()" class="w-full bg-red-50 text-red-600 font-semibold py-2.5 rounded-xl text-xs hover:bg-red-100 transition">Cancella tutti i dati</button>
                        <button onclick="esportaCSV()" class="w-full bg-gray-100 text-gray-700 font-semibold py-2.5 rounded-xl text-xs hover:bg-gray-200 transition">Esporta in CSV</button>
                    </div>

                    <div class="bg-white p-4 rounded-2xl border border-gray-200 shadow-sm space-y-2 text-center">
                        <h3 class="font-bold text-gray-800 text-sm">SpesaSmart v1.0.0</h3>
                        <p class="text-xs text-gray-400">Prototipo realizzato da CybernetLab</p>
                        <button onclick="naviga('dashboard')" class="mt-2 inline-block bg-brand-600 text-white px-4 py-2 rounded-xl text-xs font-semibold shadow">Torna alla Dashboard</button>
                    </div>
                </div>
            `;
        }

        function ripristinaDati() {
            if(confirm("Ripristinare i dati di esempio iniziali?")) {
                db = JSON.parse(JSON.stringify(datiDefault));
                salvaDb();
                naviga('dashboard');
            }
        }

        function cancellaTutto() {
            if(confirm("ATTENZIONE: Tutti i dati locali verranno eliminati. Continuare?")) {
                db = { spese: [], obiettivi: [], promemoria: [] };
                salvaDb();
                naviga('dashboard');
            }
        }

        function esportaCSV() {
            let csv = "ID,Importo,Categoria,Data,Nota\n";
            db.spese.forEach(s => {
                csv += `${s.id},${s.importo},${s.categoria},${s.data},"${s.nota || ''}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', 'spese_spesasmart.csv');
            a.click();
        }

        renderizza();

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(function(){});
        }
    </script>
</body>
</html>
