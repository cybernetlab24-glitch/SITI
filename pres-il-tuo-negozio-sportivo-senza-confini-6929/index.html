<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Presentazione</title>
<style>
:root{--a:#20d9ff;--b:#a16cff;--bg:#030711;--ink:#eef8ff;--muted:#9fb3c8;--font:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
#fondo{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.velo{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 120%,rgba(3,7,17,0) 0,rgba(3,7,17,.55) 70%),linear-gradient(180deg,rgba(3,7,17,.35),transparent 30%,transparent 70%,rgba(3,7,17,.6))}
.griglia{position:fixed;left:-50%;right:-50%;bottom:-10%;height:55%;z-index:1;pointer-events:none;opacity:.22;
  background-image:linear-gradient(var(--a) 1px,transparent 1px),linear-gradient(90deg,var(--a) 1px,transparent 1px);background-size:60px 60px;
  transform:perspective(500px) rotateX(70deg);transform-origin:top;mask-image:linear-gradient(0deg,#000,transparent);-webkit-mask-image:linear-gradient(0deg,#000,transparent);animation:scorri 6s linear infinite}
@keyframes scorri{to{background-position:0 60px}}
.marchio{position:fixed;top:clamp(14px,2.4vh,26px);left:clamp(16px,3vw,40px);z-index:5;font-size:clamp(10px,1vw,13px);letter-spacing:.38em;color:var(--a);text-transform:uppercase;opacity:.9}
.marchio b{color:var(--ink);font-weight:700}
.numero{position:fixed;top:clamp(14px,2.4vh,26px);right:clamp(16px,3vw,40px);z-index:5;font:600 clamp(11px,1vw,14px) ui-monospace,Consolas,monospace;color:var(--muted);letter-spacing:.12em}
.barra{position:fixed;left:0;bottom:0;height:3px;z-index:6;background:linear-gradient(90deg,var(--a),var(--b));box-shadow:0 0 14px var(--a);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.aiuto{position:fixed;bottom:14px;right:18px;z-index:6;font-size:12px;color:var(--muted);opacity:.0;transition:opacity .4s}
body.mostra-aiuto .aiuto{opacity:.75}
.tasto{position:fixed;z-index:6;bottom:12px;left:16px;display:flex;gap:8px}
.tasto button{background:rgba(255,255,255,.06);color:var(--ink);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:7px 13px;font:600 12px var(--font);cursor:pointer;backdrop-filter:blur(6px)}
body.nascondi .tasto,body.nascondi .aiuto{opacity:0;pointer-events:none}
body.nascondi{cursor:none}

#palco{position:fixed;inset:0;z-index:2;perspective:1600px}
.slide{position:absolute;inset:0;display:grid;place-items:center;padding:clamp(60px,9vh,110px) clamp(22px,7vw,120px);
  opacity:0;visibility:hidden;transform:translateX(8%) rotateY(-14deg) scale(.94);filter:blur(10px);
  transition:opacity .9s cubic-bezier(.2,.8,.2,1),transform 1.1s cubic-bezier(.2,.8,.2,1),filter .9s,visibility 0s .9s}
.slide.prima{transform:translateX(-8%) rotateY(14deg) scale(.94)}
.slide.attiva{opacity:1;visibility:visible;transform:none;filter:none;transition:opacity .9s cubic-bezier(.2,.8,.2,1),transform 1.1s cubic-bezier(.2,.8,.2,1),filter .9s,visibility 0s}
.cont{width:min(1180px,100%);position:relative}
.anim{opacity:0;transform:translateY(34px);filter:blur(8px)}
.attiva .anim{animation:entra 1s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(.25s + var(--i,0) * .13s)}
@keyframes entra{to{opacity:1;transform:none;filter:none}}

.eti{display:inline-flex;align-items:center;gap:10px;font-size:clamp(11px,1.1vw,14px);letter-spacing:.34em;text-transform:uppercase;color:var(--a);margin-bottom:clamp(12px,2vh,22px)}
.eti::before{content:"";width:34px;height:2px;background:linear-gradient(90deg,var(--a),var(--b));box-shadow:0 0 10px var(--a)}
h1,h2{font-weight:800;letter-spacing:-.01em;line-height:1.04}
h1{font-size:clamp(40px,7.2vw,104px)}
h2{font-size:clamp(30px,4.6vw,66px);margin-bottom:clamp(16px,3vh,34px)}
.grad{background:linear-gradient(100deg,#fff 0%,var(--a) 45%,var(--b) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  background-size:200% 100%;animation:luce 7s ease-in-out infinite alternate}
@keyframes luce{to{background-position:100% 0}}
.sotto{font-size:clamp(17px,2vw,27px);color:var(--muted);margin-top:clamp(14px,2.5vh,28px);max-width:900px;line-height:1.45}
.testo{font-size:clamp(16px,1.7vw,23px);color:#cfe1f2;line-height:1.55;max-width:860px}

 
.copertina .cont{text-align:left}
.copertina .alone{position:absolute;right:-6%;top:50%;width:min(46vw,620px);aspect-ratio:1;transform:translateY(-50%);border-radius:50%;
  background:conic-gradient(from 0deg,var(--a),var(--b),transparent 60%,var(--a));filter:blur(2px);opacity:.55;
  -webkit-mask:radial-gradient(circle,transparent 62%,#000 63%,#000 64%,transparent 65%,transparent 72%,#000 73%,#000 73.6%,transparent 74.5%);
          mask:radial-gradient(circle,transparent 62%,#000 63%,#000 64%,transparent 65%,transparent 72%,#000 73%,#000 73.6%,transparent 74.5%);animation:gira 18s linear infinite}
@keyframes gira{to{transform:translateY(-50%) rotate(360deg)}}

 
.lista{display:grid;gap:clamp(10px,1.8vh,18px);max-width:980px}
.punto{display:flex;gap:18px;align-items:flex-start;padding:clamp(14px,2vh,22px) clamp(16px,2vw,26px);border-radius:16px;
  background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(8px);
  font-size:clamp(16px,1.75vw,24px);line-height:1.4;position:relative;overflow:hidden}
.punto::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.08) 50%,transparent 60%);transform:translateX(-100%)}
.attiva .punto::after{animation:riflesso 1.6s calc(.8s + var(--i,0)*.13s) ease-out}
@keyframes riflesso{to{transform:translateX(100%)}}
.punto i{flex:none;width:clamp(30px,2.6vw,38px);height:clamp(30px,2.6vw,38px);border-radius:10px;display:grid;place-items:center;font:700 clamp(13px,1.2vw,16px) ui-monospace,Consolas,monospace;
  color:#031018;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 0 18px color-mix(in srgb,var(--a) 50%,transparent)}
.duo{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(20px,4vw,60px);align-items:center}
.duo .foto{height:min(62vh,560px)}

 
.numeri{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:clamp(14px,2vw,26px)}
.num{padding:clamp(20px,3vh,34px) clamp(18px,2vw,28px);border-radius:20px;background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.015));
  border:1px solid rgba(255,255,255,.12);position:relative;overflow:hidden}
.num::before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:linear-gradient(90deg,var(--a),var(--b))}
.num b{display:block;font-size:clamp(40px,5.4vw,78px);font-weight:800;line-height:1;background:linear-gradient(120deg,#fff,var(--a));-webkit-background-clip:text;background-clip:text;color:transparent}
.num span{display:block;margin-top:10px;color:var(--muted);font-size:clamp(14px,1.4vw,19px);line-height:1.35}

 
.colonne{display:grid;grid-template-columns:1fr 1fr;gap:clamp(14px,2.4vw,30px)}
.col{padding:clamp(18px,3vh,30px);border-radius:20px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04)}
.col:last-child{border-color:color-mix(in srgb,var(--a) 60%,transparent);background:linear-gradient(160deg,color-mix(in srgb,var(--a) 14%,transparent),color-mix(in srgb,var(--b) 10%,transparent));box-shadow:0 0 40px color-mix(in srgb,var(--a) 18%,transparent)}
.col h3{font-size:clamp(18px,2vw,28px);margin-bottom:14px}
.col li{list-style:none;padding:8px 0 8px 28px;position:relative;font-size:clamp(15px,1.5vw,20px);color:#d6e6f5;border-top:1px solid rgba(255,255,255,.07)}
.col li::before{content:"–";position:absolute;left:4px;color:var(--muted)}
.col:last-child li::before{content:"✓";color:var(--a);font-weight:700}

 
.foto{position:relative;width:100%;border-radius:22px;overflow:hidden;border:1px solid rgba(255,255,255,.14);box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 50px color-mix(in srgb,var(--a) 18%,transparent)}
.foto img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.12)}
.attiva .foto img{animation:kenburns 14s ease-out forwards}
@keyframes kenburns{to{transform:scale(1) translate(-1%,-1%)}}
.immagine{padding:0}
.immagine .sfondo{position:absolute;inset:0}
.immagine .sfondo img{width:100%;height:100%;object-fit:cover;transform:scale(1.15);opacity:.95}
.attiva.immagine .sfondo img{animation:kenburns 16s ease-out forwards}
.immagine .sfondo::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,7,17,.92) 0%,rgba(3,7,17,.6) 45%,rgba(3,7,17,.1) 100%),linear-gradient(0deg,rgba(3,7,17,.8),transparent 40%)}
.immagine .cont{padding:0 clamp(22px,7vw,120px);align-self:end;margin-bottom:clamp(70px,12vh,140px)}

 
.cita{font-size:clamp(26px,3.6vw,52px);font-weight:300;line-height:1.3;max-width:1000px;position:relative;padding-left:clamp(24px,3vw,44px)}
.cita::before{content:"";position:absolute;left:0;top:.2em;bottom:.2em;width:4px;border-radius:4px;background:linear-gradient(180deg,var(--a),var(--b));box-shadow:0 0 16px var(--a)}
.firma{margin-top:22px;color:var(--a);letter-spacing:.2em;text-transform:uppercase;font-size:clamp(12px,1.1vw,15px)}

 
.schermo{position:relative;width:min(1100px,100%,calc((100vh - 300px) * 1.7778));margin:0 auto;aspect-ratio:16/9;border-radius:22px;overflow:hidden;border:1px solid rgba(255,255,255,.16);background:#000;box-shadow:0 30px 90px rgba(0,0,0,.6),0 0 60px color-mix(in srgb,var(--b) 25%,transparent)}
.schermo iframe,.schermo video{position:absolute;inset:0;width:100%;height:100%;border:0}

 
.chiusura .cont{text-align:center}
.chiusura h1{font-size:clamp(40px,6.4vw,92px)}
.cta{display:inline-flex;margin-top:clamp(22px,4vh,40px);padding:clamp(14px,2vh,18px) clamp(26px,3vw,40px);border-radius:999px;font-weight:700;font-size:clamp(16px,1.7vw,22px);
  color:#031018;background:linear-gradient(90deg,var(--a),var(--b));box-shadow:0 0 40px color-mix(in srgb,var(--a) 45%,transparent);animation:pulsa 2.4s ease-in-out infinite}
@keyframes pulsa{50%{box-shadow:0 0 70px color-mix(in srgb,var(--b) 60%,transparent)}}
.contatti{margin-top:22px;color:var(--muted);font-size:clamp(14px,1.4vw,19px);letter-spacing:.06em}

@media (max-width:760px){.duo,.colonne{grid-template-columns:1fr}.duo .foto{height:32vh}.copertina .alone{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.anim{opacity:1;transform:none;filter:none}}
</style>
</head>

<script id="dati" type="application/json">{"titolo":"Il tuo negozio sportivo, senza confini","eti":"Sport diventa digitale","colore1":"#20d9ff","colore2":"#a16cff","slide":[{"tipo":"copertina","eti":"CybernetLab • GAR-006","titolo":"Il tuo negozio, senza confini","sottotitolo":"E-commerce e digitalizzazione per portare la tua competenza anche online."},{"tipo":"punti","eti":"La sfida","titolo":"La scelta comincia prima della visita","sottotitolo":"Se il cliente cerca online, deve trovare anche te.","punti":["Chi cerca prodotti vuole informazioni chiare, anche prima di entrare.","Orari, disponibilità e contatti difficili da trovare creano attrito.","Ordini dispersi tra messaggi e telefonate richiedono attenzione continua.","I social attirano interesse, ma serve un percorso verso l’acquisto."]},{"tipo":"confronto","eti":"Il salto digitale","titolo":"Dalla vetrina al canale vendita","colonne":[{"titolo":"Sito vetrina","punti":["Presenta negozio, marchi e servizi.","Aiuta i clienti locali a trovarti."]},{"titolo":"E-commerce professionale","punti":["Aggiunge catalogo, carrello e percorso d’acquisto.","Apre la vendita anche oltre il territorio.","Porta gli ordini in un ambiente dedicato."]}]},{"tipo":"immagine","eti":"Progetto GAR-006","titolo":"La tua esperienza, anche online","testo":"Una vetrina professionale per il territorio, un negozio digitale per raggiungere clienti nazionali."},{"tipo":"punti","eti":"Come funziona","titolo":"Dalla scelta alla gestione dell’ordine","punti":["Il cliente esplora categorie, prodotti, taglie e varianti.","Consulta schede chiare e aggiunge i prodotti al carrello.","Completa l’acquisto con le modalità concordate.","Lo staff consulta gli ordini e ne aggiorna lo stato.","Spedizioni, resi e disponibilità seguono procedure definite insieme."]},{"tipo":"punti","eti":"Vantaggi concreti","titolo":"Facile da trovare, semplice da usare","punti":["Esperienza mobile friendly, pensata per acquistare dallo smartphone.","Velocità di navigazione curata per ridurre gli ostacoli.","Presenza locale valorizzata con informazioni e contatti chiari.","Social collegati a prodotti e pagine pertinenti.","Visite, richieste e ordini aiutano a valutare il percorso digitale."]},{"tipo":"numeri","eti":"L’offerta e-commerce","titolo":"Partiamo dal progetto giusto","sottotitolo":"GAR-006: scegliamo il perimetro in base al tuo negozio.","numeri":[{"valore":"1.990 €","etichetta":"E-commerce base • a partire da"},{"valore":"3.490 €","etichetta":"E-commerce avanzato • a partire da"}],"testo":"Preventivo definitivo dopo aver concordato catalogo, funzionalità, contenuti e integrazioni."},{"tipo":"numeri","eti":"Assistenza WebCare","titolo":"Dopo il lancio, restiamo al fianco","sottotitolo":"Piani di manutenzione e un riferimento dedicato CybernetLab.","numeri":[{"valore":"39 €/mese","etichetta":"WebCare Essential"},{"valore":"89 €/mese","etichetta":"WebCare Professional"},{"valore":"179 €/mese","etichetta":"WebCare Business"}],"testo":"Scegliamo insieme il piano; attività incluse e livelli di assistenza saranno definiti contrattualmente."},{"tipo":"punti","eti":"Consulenza digitale","titolo":"Prima il metodo, poi gli strumenti","sottotitolo":"Analisi e digitalizzazione processi: a partire da 290 €.","punti":["Analizziamo vendita, catalogo e gestione attuale delle richieste.","Definiamo priorità, responsabilità e materiali necessari.","Concordiamo struttura, funzionalità e percorso operativo.","Validiamo il progetto prima della pubblicazione.","Pianifichiamo gli sviluppi successivi sulle esigenze reali."]},{"tipo":"chiusura","eti":"Il prossimo passo","titolo":"Portiamo il tuo negozio online","sottotitolo":"Diamo forma a GAR-006, partendo dalle tue priorità.","cta":"Confermiamo e-commerce e analisi digitale: definiamo il perimetro e firmiamo il preventivo.","contatti":"CybernetLab • Referente: Boss • Anteprima GAR-006: https://cybernetlab24-glitch.github.io/SITI/sporttech-pro/"}],"marchio":"CYBERNETLAB","scrittoDa":"ChatGPT"}</script>
<script>
(function(){
'use strict';
var D={};try{D=JSON.parse(document.getElementById('dati').textContent)}catch(e){D={titolo:'Presentazione',slide:[]}}
var S=D.slide||[],R=document.documentElement;
if(D.colore1)R.style.setProperty('--a',D.colore1);if(D.colore2)R.style.setProperty('--b',D.colore2);
document.title=D.titolo||'Presentazione';
document.getElementById('marchio').innerHTML='<b>'+esc(D.marchio||'CYBERNETLAB')+'</b> · '+esc(D.eti||'presentazione');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function el(tag,cls,html,i){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(i!=null){e.classList.add('anim');e.style.setProperty('--i',i)}return e}
function yt(u){var m=String(u||'').match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);return m?m[1]:''}
function foto(src,cls,i){var f=el('div',(cls||'')+' foto',null,i);var im=new Image();im.alt='';im.loading='eager';im.src=src;f.appendChild(im);return f}

var palco=document.getElementById('palco');
S.forEach(function(s,n){
  var t=s.tipo||'punti',sec=el('section','slide '+t),c=el('div','cont'),k=0;
  sec.dataset.n=n;
  if(t==='immagine'&&s.img){var sf=el('div','sfondo');var im=new Image();im.alt='';im.src=s.img;sf.appendChild(im);sec.appendChild(sf)}
  if(t==='copertina'){sec.appendChild(el('div','alone'))}
  if(s.eti)c.appendChild(el('div','eti',esc(s.eti),k++));
  if(t==='copertina'||t==='chiusura'){c.appendChild(el('h1','grad',esc(s.titolo),k++))}
  else if(s.titolo&&t!=='citazione'){c.appendChild(el('h2','',esc(s.titolo),k++))}
  if(t==='copertina'||t==='chiusura'||t==='immagine'){if(s.sottotitolo)c.appendChild(el('p','sotto',esc(s.sottotitolo),k++))}
  if(t==='punti'){
    var lista=el('div','lista');(s.punti||[]).slice(0,6).forEach(function(p,j){var d=el('div','punto','<i>'+(j+1<10?'0':'')+(j+1)+'</i><div>'+esc(p)+'</div>',k++);lista.appendChild(d)});
    if(s.testo)c.appendChild(el('p','testo',esc(s.testo),k++));
    if(s.img){var duo=el('div','duo');duo.appendChild(lista);duo.appendChild(foto(s.img,'',k++));c.appendChild(duo)}else c.appendChild(lista);
  }
  if(t==='numeri'){var g=el('div','numeri');(s.numeri||[]).slice(0,4).forEach(function(x){var b=el('div','num','<b data-v="'+esc(x.valore)+'">'+esc(x.valore)+'</b><span>'+esc(x.etichetta)+'</span>',k++);g.appendChild(b)});c.appendChild(g);if(s.testo)c.appendChild(el('p','sotto',esc(s.testo),k++))}
  if(t==='confronto'){var cc=el('div','colonne');(s.colonne||[]).slice(0,2).forEach(function(x){var col=el('div','col','<h3>'+esc(x.titolo)+'</h3><ul>'+(x.punti||[]).map(function(p){return'<li>'+esc(p)+'</li>'}).join('')+'</ul>',k++);cc.appendChild(col)});c.appendChild(cc)}
  if(t==='citazione'){c.appendChild(el('blockquote','cita',esc(s.testo||s.titolo),k++));if(s.sottotitolo)c.appendChild(el('div','firma',esc(s.sottotitolo),k++))}
  if(t==='immagine'&&s.testo)c.appendChild(el('p','testo',esc(s.testo),k++));
  if(t==='video'){var sc=el('div','schermo',null,k++);sc.dataset.video=s.video||'';c.appendChild(sc);if(s.testo)c.appendChild(el('p','sotto',esc(s.testo),k++))}
  if(t==='chiusura'){if(s.cta)c.appendChild(el('div','cta',esc(s.cta),k++));if(s.contatti)c.appendChild(el('div','contatti',esc(s.contatti),k++))}
  sec.appendChild(c);palco.appendChild(sec);
});

var tutte=[].slice.call(document.querySelectorAll('.slide')),cur=-1;
function contaNumeri(s){[].forEach.call(s.querySelectorAll('.num b'),function(b){var v=b.dataset.v,m=String(v).match(/^([^\d-]*)(-?[\d.,]+)(.*)$/);if(!m)return;
  var num=parseFloat(m[2].replace(/\./g,'').replace(',','.')),dec=(m[2].split(',')[1]||'').length,t0=performance.now();if(isNaN(num))return;
  (function f(t){var p=Math.min(1,(t-t0)/1600),e=1-Math.pow(1-p,3);b.textContent=m[1]+(num*e).toLocaleString('it-IT',{minimumFractionDigits:dec,maximumFractionDigits:dec})+m[3];if(p<1)requestAnimationFrame(f)})(t0+0)})}
function video(s,on){[].forEach.call(s.querySelectorAll('.schermo'),function(sc){
  if(!on){sc.innerHTML='';return}var u=sc.dataset.video,id=yt(u);
  if(id)sc.innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1&mute=1&rel=0&modestbranding=1&playsinline=1" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>';
  else if(u)sc.innerHTML='<video src="'+esc(u)+'" autoplay muted loop playsinline controls></video>'})}
function vai(n){n=Math.max(0,Math.min(tutte.length-1,n));if(n===cur)return;
  tutte.forEach(function(s,i){s.classList.toggle('attiva',i===n);s.classList.toggle('prima',i<n)});
  if(cur>=0)video(tutte[cur],false);cur=n;video(tutte[n],true);contaNumeri(tutte[n]);
  document.getElementById('numero').textContent=String(n+1).padStart(2,'0')+' / '+String(tutte.length).padStart(2,'0');
  document.getElementById('barra').style.width=((n+1)/tutte.length*100)+'%';
  try{history.replaceState(null,'','#'+(n+1))}catch(e){}
  energia=1;}
addEventListener('keydown',function(e){var k=e.key;
